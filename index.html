<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Registro e Inspección</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

  <header class="bg-indigo-900 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i data-lucide="shield-alert" class="w-8 h-8 text-indigo-300"></i>
        <h1 class="text-xl font-bold tracking-wide">Registro de Detenidos</h1>
      </div>
      <div class="flex bg-indigo-950 p-1 rounded-lg">
        <button id="btnTabRegistro" onclick="switchTab('registro')" class="px-4 py-2 text-sm font-semibold rounded-md bg-indigo-600 text-white transition-all shadow">
          <i data-lucide="user-plus" class="inline w-4 h-4 mr-1"></i> Registro
        </button>
        <button id="btnTabConsulta" onclick="switchTab('consulta'); cargarRegistros();" class="px-4 py-2 text-sm font-semibold rounded-md text-indigo-300 hover:text-white transition-all">
          <i data-lucide="database" class="inline w-4 h-4 mr-1"></i> Visualizador
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8">

    <!-- PESTAÑA 1: FORMULARIO DE REGISTRO -->
    <div id="tab-registro" class="space-y-6">
      <form id="formRegistro" class="bg-white rounded-xl shadow-md p-6 space-y-6">
        
        <!-- Sección 1: Datos de la Detención -->
        <div>
          <h2 class="text-lg font-bold text-indigo-900 border-b pb-2 mb-4 flex items-center gap-2">
            <i data-lucide="file-text" class="w-5 h-5 text-indigo-600"></i> Datos Generales de la Detención
          </h2>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
              <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Motivo de Detención *</label>
              <select id="motivoDetencion" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500">
                <option value="">-- Seleccionar Motivo --</option>
                <option value="DELITOS CONTRA LA SALUD">DELITOS CONTRA LA SALUD</option>
                <option value="DESACATO ORDEN LEGITIMA">DESACATO ORDEN LEGITIMA</option>
                <option value="PORTACION ARMAS DE FUEGO Y/0 USO EXCLUSIVO">PORTACION ARMAS DE FUEGO Y/0 USO EXCLUSIVO</option>
                <option value="ROBO DE VEHICULO">ROBO DE VEHICULO</option>
                <option value="ROBO SIMPLE">ROBO SIMPLE</option>
                <option value="ROBO CON VIOLENCIA">ROBO CON VIOLENCIA</option>
                <option value="LESIONES">LESIONES</option>
                <option value="RESISTENCIA A PARTICULARES">RESISTENCIA A PARTICULARES</option>
                <option value="ALLANAMIENTO DE MORADA">ALLANAMIENTO DE MORADA</option>
                <option value="FALTAS ADMINISTRATIVAS">FALTAS ADMINISTRATIVAS</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Fecha de Detención</label>
              <input type="date" id="fechaDetencion" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Hora de Detención</label>
              <input type="time" id="horaDetencion" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Folio IPH / Registro</label>
              <input type="text" id="folio" placeholder="Ej. 252907850" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="md:col-span-2">
              <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Lugar Exacto de Detención</label>
              <input type="text" id="lugarDetencion" placeholder="Cruce de calles, referencia o ubicación" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500">
            </div>
          </div>
        </div>

        <!-- Sección 2: Captura de Foto -->
        <div>
          <h2 class="text-lg font-bold text-indigo-900 border-b pb-2 mb-4 flex items-center gap-2">
            <i data-lucide="camera" class="w-5 h-5 text-indigo-600"></i> Fotografía del Detenido
          </h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-center">
            <div>
              <input type="file" id="fotoInput" accept="image/*" capture="environment" class="hidden" onchange="previewFile(event)">
              <button type="button" onclick="document.getElementById('fotoInput').click()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-4 py-2.5 rounded-lg text-sm font-semibold border border-indigo-200 flex items-center gap-2">
                <i data-lucide="upload" class="w-4 h-4"></i> Tomar o Subir Foto
              </button>
            </div>
            <div class="flex justify-center">
              <div class="w-32 h-32 border-2 border-dashed border-slate-300 rounded-lg flex items-center justify-center overflow-hidden bg-slate-50">
                <span id="previewPlaceholder" class="text-xs text-slate-400 text-center p-2">Sin foto</span>
                <img id="imgPreview" class="hidden w-full h-full object-cover">
              </div>
            </div>
          </div>
        </div>

        <!-- Sección 3: Datos Personales -->
        <div>
          <h2 class="text-lg font-bold text-indigo-900 border-b pb-2 mb-4 flex items-center gap-2">
            <i data-lucide="user" class="w-5 h-5 text-indigo-600"></i> Información del Detenido
          </h2>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
              <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Nombre(s) *</label>
              <input type="text" id="nombre" required placeholder="Nombre sin apellidos" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Apellido Paterno *</label>
              <input type="text" id="apellidoPaterno" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Apellido Materno</label>
              <input type="text" id="apellidoMaterno" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Alias / Apodo</label>
              <input type="text" id="alias" placeholder="Ej. El Negro" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Fecha de Nacimiento</label>
              <input type="date" id="fechaNacimiento" onchange="calcularEdad()" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Edad</label>
              <input type="text" id="edad" placeholder="Ej. 34 AÑOS" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">CURP</label>
              <input type="text" id="curp" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 uppercase">
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Estado Civil</label>
              <select id="estadoCivil" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500">
                <option value="">-- Seleccionar --</option>
                <option value="SOLTERO">SOLTERO</option>
                <option value="CASADO">CASADO</option>
                <option value="UNION LIBRE">UNION LIBRE</option>
                <option value="DIVORCIADO">DIVORCIADO</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Grado de Estudios</label>
              <select id="gradoEstudios" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500">
                <option value="">-- Seleccionar --</option>
                <option value="SIN ESTUDIOS">SIN ESTUDIOS</option>
                <option value="PRIMARIA">PRIMARIA</option>
                <option value="SECUNDARIA">SECUNDARIA</option>
                <option value="PREPARATORIA">PREPARATORIA</option>
                <option value="UNIVERSIDAD">UNIVERSIDAD</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Sección 4: Domicilio -->
        <div>
          <h2 class="text-lg font-bold text-indigo-900 border-b pb-2 mb-4 flex items-center gap-2">
            <i data-lucide="map-pin" class="w-5 h-5 text-indigo-600"></i> Domicilio
          </h2>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
              <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Calle</label>
              <input type="text" id="calle" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Número</label>
              <input type="text" id="numero" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Colonia</label>
              <input type="text" id="colonia" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Municipio</label>
              <select id="municipio" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500">
                <option value="MONTERREY">MONTERREY</option>
                <option value="GUADALUPE">GUADALUPE</option>
                <option value="SAN NICOLAS">SAN NICOLAS</option>
                <option value="APODACA">APODACA</option>
                <option value="ESCOBEDO">ESCOBEDO</option>
                <option value="SANTA CATARINA">SANTA CATARINA</option>
                <option value="SAN PEDRO">SAN PEDRO</option>
                <option value="GARCIA">GARCIA</option>
                <option value="JUAREZ">JUAREZ</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Sección 5: Objetos Asegurados y Declaración -->
        <div>
          <h2 class="text-lg font-bold text-indigo-900 border-b pb-2 mb-4 flex items-center gap-2">
            <i data-lucide="package" class="w-5 h-5 text-indigo-600"></i> Indicios y Entrevista
          </h2>
          <div class="space-y-4">
            <div>
              <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Objetos Asegurados</label>
              <textarea id="objetoAsegurado" rows="2" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500"></textarea>
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Entrevista / Declaración</label>
              <textarea id="entrevista" rows="4" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500"></textarea>
            </div>
          </div>
        </div>

        <button type="submit" id="btnGuardar" class="w-full bg-indigo-900 hover:bg-indigo-800 text-white font-bold py-3.5 px-6 rounded-lg shadow-lg flex items-center justify-center gap-2 text-base transition-all">
          <i data-lucide="save" class="w-5 h-5"></i> Guardar Registro en Google Sheets
        </button>
        <div id="statusAlert" class="hidden p-4 rounded-lg text-sm text-center font-semibold"></div>
      </form>
    </div>

    <!-- PESTAÑA 2: VISUALIZADOR DE REGISTROS -->
    <div id="tab-consulta" class="hidden space-y-4">
      <div class="bg-white rounded-xl shadow-md p-6">
        <h2 class="text-xl font-bold text-indigo-900 mb-4 flex items-center gap-2">
          <i data-lucide="list" class="w-6 h-6 text-indigo-600"></i> Registros en Tiempo Real
        </h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse text-sm" id="tablaRegistros">
            <thead>
              <tr class="bg-indigo-950 text-white text-xs uppercase tracking-wider">
                <th class="p-3">Foto</th>
                <th class="p-3">Fecha/Hora</th>
                <th class="p-3">Nombre</th>
                <th class="p-3">Motivo</th>
                <th class="p-3">Folio</th>
                <th class="p-3">Ubicación</th>
              </tr>
            </thead>
            <tbody id="tbodyRegistros" class="divide-y divide-slate-200">
              <tr><td colspan="6" class="text-center p-8 text-slate-500">Cargando datos...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </main>

  <script>
    lucide.createIcons();

    // PEGA AQUÍ TU URL DE GOOGLE APPS SCRIPT
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxM712sdaYYU6H6v8IT1illEICVj2L0Fe-nY8aNoguGJV4SyxUUdqovTzrfPnUkOdOT/exec";

    let fotoBase64Data = "";

    function switchTab(tab) {
      if (tab === 'registro') {
        document.getElementById('tab-registro').classList.remove('hidden');
        document.getElementById('tab-consulta').classList.add('hidden');
      } else {
        document.getElementById('tab-registro').classList.add('hidden');
        document.getElementById('tab-consulta').classList.remove('hidden');
      }
    }

    function previewFile(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          fotoBase64Data = e.target.result;
          document.getElementById('imgPreview').src = fotoBase64Data;
          document.getElementById('imgPreview').classList.remove('hidden');
          document.getElementById('previewPlaceholder').classList.add('hidden');
        };
        reader.readAsDataURL(file);
      }
    }

    function calcularEdad() {
      const fechaNac = document.getElementById('fechaNacimiento').value;
      if (fechaNac) {
        const fn = new Date(fechaNac);
        const hoy = new Date();
        let edad = hoy.getFullYear() - fn.getFullYear();
        const m = hoy.getMonth() - fn.getMonth();
        if (m < 0 || (m === 0 && hoy.getDate() < fn.getDate())) {
          edad--;
        }
        document.getElementById('edad').value = edad + " AÑOS";
      }
    }

    document.getElementById('formRegistro').addEventListener('submit', function(e) {
      e.preventDefault();
      const statusAlert = document.getElementById('statusAlert');
      const btnGuardar = document.getElementById('btnGuardar');
      
      btnGuardar.disabled = true;
      statusAlert.className = "p-4 rounded-lg text-sm text-center font-semibold bg-blue-50 text-blue-700 block";
      statusAlert.textContent = "Guardando registro en Google Sheets...";

      const payload = {
        motivoDetencion: document.getElementById('motivoDetencion').value,
        fechaDetencion: document.getElementById('fechaDetencion').value,
        horaDetencion: document.getElementById('horaDetencion').value,
        folio: document.getElementById('folio').value,
        lugarDetencion: document.getElementById('lugarDetencion').value,
        nombre: document.getElementById('nombre').value,
        apellidoPaterno: document.getElementById('apellidoPaterno').value,
        apellidoMaterno: document.getElementById('apellidoMaterno').value,
        alias: document.getElementById('alias').value,
        fechaNacimiento: document.getElementById('fechaNacimiento').value,
        edad: document.getElementById('edad').value,
        curp: document.getElementById('curp').value,
        estadoCivil: document.getElementById('estadoCivil').value,
        gradoEstudios: document.getElementById('gradoEstudios').value,
        calle: document.getElementById('calle').value,
        numero: document.getElementById('numero').value,
        colonia: document.getElementById('colonia').value,
        municipio: document.getElementById('municipio').value,
        objetoAsegurado: document.getElementById('objetoAsegurado').value,
        entrevista: document.getElementById('entrevista').value,
        fotoBase64: fotoBase64Data
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusAlert.className = "p-4 rounded-lg text-sm text-center font-semibold bg-emerald-50 text-emerald-700 block";
        statusAlert.textContent = "¡Registro e imagen guardados correctamente!";
        document.getElementById('formRegistro').reset();
        document.getElementById('imgPreview').classList.add('hidden');
        document.getElementById('previewPlaceholder').classList.remove('hidden');
        fotoBase64Data = "";
      })
      .catch(err => {
        statusAlert.className = "p-4 rounded-lg text-sm text-center font-semibold bg-rose-50 text-rose-700 block";
        statusAlert.textContent = "Error al enviar el registro.";
      })
      .finally(() => {
        btnGuardar.disabled = false;
      });
    });

    function cargarRegistros() {
      const tbody = document.getElementById('tbodyRegistros');
      tbody.innerHTML = `<tr><td colspan="6" class="text-center p-8 text-slate-500">Cargando registros...</td></tr>`;

      fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
          tbody.innerHTML = '';
          if (data.records && data.records.length > 0) {
            data.records.forEach(row => {
              const tr = document.createElement('tr');
              const fotoUrl = row['FOTOGRAFIA DETENIDO'] || row['ENLACE'];
              const fotoHtml = fotoUrl && fotoUrl.startsWith('http') 
                ? `<a href="${fotoUrl}" target="_blank" class="text-indigo-600 font-semibold underline text-xs">Ver Foto</a>`
                : `<span class="text-slate-400 text-xs">N/A</span>`;

              tr.innerHTML = `
                <td class="p-3">${fotoHtml}</td>
                <td class="p-3 text-xs text-slate-500">${row['Marca temporal'] || ''}</td>
                <td class="p-3 font-semibold text-slate-800">${row['NOMBRE '] || ''} ${row['APELLIDO PATERNO'] || ''} ${row['APELLIDO MATERNO'] || ''}</td>
                <td class="p-3"><span class="bg-indigo-50 text-indigo-700 px-2 py-1 rounded text-xs font-semibold">${row['MOTIVO DE DETENCION'] || ''}</span></td>
                <td class="p-3 text-xs font-mono">${row['FOLIO'] || ''}</td>
                <td class="p-3 text-xs">${row['CALLE'] || ''} ${row['N°'] || ''}, ${row['COLONIA'] || ''}</td>
              `;
              tbody.appendChild(tr);
            });
          } else {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center p-8 text-slate-500">No hay registros aún.</td></tr>`;
          }
        });
    }
  </script>
</body>
</html>
